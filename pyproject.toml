[project]
name = "notable"
version = "0.1.0"
description = "Voice-first note capture and semantic retrieval."
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.135.1",
    "uvicorn>=0.41.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.13.1",
    "sqlalchemy>=2.0.48",
    "chromadb>=1.5.2",
    "faster-whisper>=1.2.1",
    "openai>=2.24.0",
    "scipy>=1.17.1",
    "numpy>=2.4.2",
    "noisereduce>=3.0.3",
    "torch>=2.2.2",
    "silero-vad",
    "python-dotenv>=1.2.2",
    "tiktoken",
]

[project.optional-dependencies]
dev = [
    "black>=26.3.1",
    "isort>=8.0.1",
    "pytest>=9.0.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
